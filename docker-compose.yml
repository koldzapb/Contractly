services:
  # Nginx Web Server
  nginx:
    image: nginx:1.25-alpine
    container_name: contractly-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - app
      - node
    networks:
      - contractly

  # PHP-FPM Application
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: contractly-app
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - contractly

  # Laravel Horizon (Queue Dashboard & Worker)
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: contractly-horizon
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    command: php artisan horizon
    depends_on:
      - app
      - redis
    restart: unless-stopped
    networks:
      - contractly

  # Task Scheduler
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: contractly-scheduler
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - contractly

  # Node.js (Vue Frontend)
  node:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: contractly-node
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - contractly

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: contractly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-contractly}
      POSTGRES_USER: ${DB_USERNAME:-contractly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-contractly} -d ${DB_DATABASE:-contractly}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contractly

  # Redis Cache/Queue/Session
  redis:
    image: redis:7-alpine
    container_name: contractly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contractly

  # Mailpit (Email Testing) - ARM64 native alternative to Mailhog
  mailpit:
    image: axllent/mailpit:latest
    container_name: contractly-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - contractly

networks:
  contractly:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
